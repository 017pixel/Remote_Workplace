name: Qualität

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.29.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm architecture:extensions
      - run: pnpm typecheck
      - run: pnpm exec eslint . --max-warnings=0
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm security:audit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Der e2e-Server erwartet WRAPT_E2E_USER (Fallback user@example.com);
      # WRAPT_DEV_TAILSCALE_USER aktiviert nur die Preview-Test-Szenarien.
      WRAPT_E2E_USER: e2e@wrapt.invalid
      WRAPT_DEV_TAILSCALE_USER: e2e@wrapt.invalid
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.29.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Preview-Laufzeiten starten über tmux auf dem separaten Preview-Socket.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
